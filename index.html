<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deutsch Lernen — Free German Learning</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" integrity="sha384-tMH8h3BGESGckSAVGZ82T9n90ztNXxvdwvdM6UoR56cYcf+0iGXBliJ29D+wZ/x8" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" integrity="sha384-bm7MnzvK++ykSwVJ2tynSE5TRdN+xL418osEVF2DE/L/gfWHj91J2Sphe582B1Bh" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js" integrity="sha384-ku9eM40vVDsFUiERorrdlHlF0LIhdfn716M7TntM72Uo98T7LWiogD3hNenPx8Q0" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Caveat:wght@500;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet" />
  <style>
    /* Schulheft: German school exercise book. Graph paper, fountain-pen ink,
       highlighter marker and the teacher's red pen. */
    :root {
      --paper: #fbfcf9;
      --grid: #dde4ee;
      --ink: #1d2b64;
      --ink-soft: #3f4b80;
      --text: #1b1f2e;
      --muted: #5f6585;
      --rule: #c5cfe0;
      --marker: #ffe45c;
      --red: #c22f2b;
      --green: #1c7448;
      --der: #2b67d1;
      --die: #c92a62;
      --das: #23894f;
      --sans: 'Bricolage Grotesque', system-ui, sans-serif;
      --serif: 'Literata', Georgia, serif;
      --hand: 'Caveat', 'Segoe Print', cursive;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--sans); color: var(--text); line-height: 1.55;
      background-color: var(--paper);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 28px 28px;
      background-position: -1px -1px;
    }
    button, input { font-family: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; text-align: left; }
    a { color: inherit; }
    :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 2px; }

    /* ── buttons ── */
    .btn { display: inline-flex; align-items: center; gap: .5rem; padding: .6rem 1.15rem; border-radius: 3px; font-weight: 600; font-size: .92rem; text-decoration: none; transition: background .15s, color .15s; }
    .btn-solid { background: var(--ink); color: var(--paper); }
    .btn-solid:hover { background: #121c4a; }
    .btn-line { border: 2px solid var(--ink); color: var(--ink); padding: .45rem .95rem; }
    .btn-line:hover { background: var(--ink); color: var(--paper); }
    .btn:disabled { opacity: .55; cursor: default; }
    .btn-small { padding: .4rem .9rem; font-size: .85rem; }

    /* ── setup / cover ── */
    .cover { min-height: 100vh; display: flex; align-items: center; padding: 3rem 1.5rem; }
    .cover-sheet { width: 100%; max-width: 640px; margin: 0 auto; background: var(--paper); padding: 2.75rem 2.5rem 2.5rem; box-shadow: 0 1px 0 var(--rule), 6px 6px 0 var(--ink); border: 2px solid var(--ink); }
    .cover h1 { font-size: clamp(3.4rem, 12vw, 5.6rem); line-height: .92; font-weight: 800; letter-spacing: -.045em; color: var(--ink); font-variation-settings: 'opsz' 96; }
    .cover-lede { font-family: var(--serif); font-size: 1.05rem; color: var(--muted); margin-top: 1.1rem; max-width: 40ch; line-height: 1.6; }
    .cover h2 { font-size: 1.05rem; font-weight: 600; margin: 2.25rem 0 .5rem; }
    .levels { list-style: none; border-top: 2px solid var(--ink); }
    .level-row { display: flex; align-items: baseline; gap: 1.1rem; width: 100%; padding: .85rem .5rem; border-bottom: 1px solid var(--rule); transition: background .12s; }
    .level-row:hover { background: rgba(255,228,92,.28); }
    .level-row[aria-checked="true"] { background: var(--marker); }
    .level-code { font-size: 1.6rem; font-weight: 800; letter-spacing: -.03em; width: 3.2rem; flex-shrink: 0; color: var(--ink); }
    .level-name { font-weight: 600; }
    .level-desc { display: block; font-size: .85rem; color: var(--muted); }
    .level-row[aria-checked="true"] .level-desc { color: var(--text); }
    .cover .btn { margin-top: 1.75rem; width: 100%; justify-content: center; padding: .9rem; font-size: 1rem; }

    /* ── dashboard shell ── */
    .shell { display: flex; min-height: 100vh; }
    .rail { width: 250px; flex-shrink: 0; position: fixed; inset: 0 auto 0 0; background: var(--paper); border-right: 2px solid var(--ink); padding: 1.75rem 1.25rem; display: flex; flex-direction: column; z-index: 10; }
    .brand { font-size: 2rem; font-weight: 800; letter-spacing: -.04em; line-height: 1; color: var(--ink); }
    .brand-level { margin-top: .5rem; font-size: .88rem; color: var(--muted); }
    .brand-level b { color: var(--text); font-weight: 600; }
    .tabs { list-style: none; margin-top: 2.25rem; flex: 1; }
    .tab { display: block; width: 100%; padding: .6rem .6rem; font-size: 1.02rem; font-weight: 600; color: var(--ink-soft); border-bottom: 1px solid var(--rule); transition: background .12s; }
    .tab small { display: block; font-size: .78rem; font-weight: 400; color: var(--muted); }
    .tab:hover { background: rgba(255,228,92,.28); }
    .tab[aria-current="page"] { color: var(--ink); background: linear-gradient(transparent 52%, var(--marker) 52%, var(--marker) 92%, transparent 92%); }
    .tab[aria-current="page"] small { color: var(--text); }
    .score { margin: 1.25rem 0 1rem; }
    .score-title { font-size: .85rem; color: var(--muted); }
    .tally { display: flex; flex-wrap: wrap; gap: .5rem .6rem; margin-top: .45rem; min-height: 34px; }
    .tally-group { position: relative; display: inline-flex; gap: 4px; height: 28px; padding-right: 2px; }
    .tally-group i { width: 2.5px; background: var(--ink); border-radius: 2px; display: block; }
    .tally-group.five::after { content: ''; position: absolute; left: -4px; right: -4px; top: 50%; height: 2.5px; background: var(--red); border-radius: 2px; transform: rotate(-24deg); }
    .score-num { font-family: var(--hand); font-size: 1.6rem; font-weight: 700; color: var(--ink); line-height: 1; margin-top: .3rem; }
    .reset { font-size: .85rem; color: var(--muted); padding: .5rem 0; text-decoration: underline; text-underline-offset: 3px; }
    .reset:hover { color: var(--red); }
    .stage { margin-left: 250px; flex: 1; padding: 3rem clamp(1.25rem, 4vw, 3.5rem) 5rem; min-width: 0; }
    .sheet { max-width: 720px; background: rgba(251,252,249,.94); padding: 2rem 2.25rem 2.5rem; border: 2px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); }

    /* ── section heads ── */
    .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 1.75rem; flex-wrap: wrap; }
    .head h2 { font-size: clamp(1.7rem, 4vw, 2.3rem); line-height: 1.05; font-weight: 800; letter-spacing: -.035em; color: var(--ink); }
    .head p { color: var(--muted); font-size: .92rem; margin-top: .35rem; max-width: 46ch; }
    .head-tools { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
    .mark-chip { font-family: var(--hand); font-size: 1.35rem; font-weight: 700; color: var(--ink); background: var(--marker); padding: 0 .55rem; line-height: 1.5; }

    /* ── exercises ── */
    .ex-list { list-style: none; }
    .ex { padding: 1.35rem 0 1.25rem; border-bottom: 1px solid var(--rule); }
    .ex:first-child { padding-top: .25rem; }
    .ex-hint { font-size: .85rem; color: var(--muted); }
    .ex-sentence { font-family: var(--serif); font-size: 1.28rem; line-height: 2.1; margin-top: .15rem; }
    .blank { display: inline-block; width: 7.5em; margin: 0 .2em; padding: 0 .15em; text-align: center; background: transparent; border: none; border-bottom: 2px solid var(--ink); border-radius: 0; font-family: var(--hand); font-size: 1.75rem; font-weight: 700; color: var(--ink); line-height: 1.1; }
    .blank:focus { outline: none; background: rgba(255,228,92,.45); }
    .blank:disabled { opacity: 1; }
    .blank.ok { color: var(--ink); border-bottom-color: var(--green); }
    .blank.no { color: var(--red); text-decoration: line-through; text-decoration-thickness: 2px; border-bottom-color: var(--red); }
    .fix { font-family: var(--hand); font-size: 1.75rem; font-weight: 700; color: var(--red); margin: 0 .3em 0 .25em; }
    .ex-foot { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-top: .35rem; }
    .ex-english { font-size: .88rem; color: var(--muted); font-style: italic; font-family: var(--serif); }
    .verdict { font-weight: 600; font-size: .92rem; }
    .verdict.ok { color: var(--green); }
    .verdict.no { color: var(--red); }
    .note { margin-top: .8rem; padding: .1rem 0 .1rem .9rem; border-left: 3px solid var(--rule); font-family: var(--serif); font-size: .95rem; line-height: 1.65; max-width: 62ch; }
    .note + .note { margin-top: .6rem; }
    .note.bad { border-left-color: var(--red); }
    .note.good { border-left-color: var(--green); }
    .note b { font-family: var(--sans); font-weight: 600; }
    .shake-it { animation: shake .4s ease-out; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-5px)} 40%,80%{transform:translateX(5px)} }
    .summary { margin-top: 1.75rem; padding: 1.25rem 1.4rem; background: var(--marker); border: 2px solid var(--ink); }
    .summary p:first-child { font-size: 1.3rem; font-weight: 800; letter-spacing: -.02em; color: var(--ink); }
    .summary p + p { font-size: .9rem; margin: .25rem 0 1rem; }

    /* ── reading ── */
    .prose { font-family: var(--serif); font-size: 1.12rem; line-height: 1.85; max-width: 62ch; }
    .prose p + p { margin-top: 1rem; }
    .linkbtn { color: var(--ink-soft); font-size: .88rem; text-decoration: underline; text-underline-offset: 3px; padding: .3rem 0; }
    .translation { font-family: var(--serif); font-style: italic; color: var(--muted); font-size: .95rem; max-width: 62ch; margin-top: .3rem; }
    .qs { list-style: none; margin-top: 1.75rem; border-top: 2px solid var(--ink); }
    .q { padding: 1.2rem 0; border-bottom: 1px solid var(--rule); }
    .q-text { font-weight: 600; font-size: 1.05rem; margin-bottom: .6rem; }
    .opts { list-style: none; display: flex; flex-direction: column; gap: .3rem; }
    .opt { display: flex; align-items: baseline; gap: .7rem; width: 100%; padding: .5rem .6rem; font-family: var(--serif); font-size: 1rem; border-left: 3px solid transparent; transition: background .12s; }
    .opt:not(:disabled):hover { background: rgba(255,228,92,.3); }
    .opt:disabled { cursor: default; }
    .opt-letter { font-family: var(--hand); font-size: 1.4rem; font-weight: 700; color: var(--ink-soft); width: 1.1rem; flex-shrink: 0; line-height: 1; }
    .opt.right { border-left-color: var(--green); background: rgba(28,116,72,.09); font-weight: 600; }
    .opt.wrong { border-left-color: var(--red); color: var(--red); text-decoration: line-through; text-decoration-thickness: 1.5px; }

    /* ── vocabulary ── */
    .words { list-style: none; border-top: 2px solid var(--ink); }
    .word { border-bottom: 1px solid var(--rule); }
    .word-btn { display: block; width: 100%; padding: 1rem .5rem; transition: background .12s; }
    .word-btn:hover { background: rgba(255,228,92,.22); }
    .word-top { display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; }
    .word-de { font-size: 1.7rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; }
    .art-der { color: var(--der); } .art-die { color: var(--die); } .art-das { color: var(--das); }
    .word-type { font-size: .82rem; color: var(--muted); }
    .word-pron { font-size: .88rem; color: var(--muted); margin-left: auto; }
    .word-mean { font-family: var(--serif); font-size: 1.02rem; margin-top: .1rem; }
    .word-more { padding: .2rem .5rem 1.25rem; max-width: 62ch; }
    .word-ex { font-family: var(--serif); font-size: 1.1rem; }
    .word-ex-en { font-family: var(--serif); font-style: italic; color: var(--muted); font-size: .92rem; margin-top: .1rem; }
    .word-tip { margin-top: .75rem; padding: .35rem .8rem; background: rgba(255,228,92,.55); font-size: .9rem; }
    .gender-key { display: flex; gap: 1rem; font-size: .85rem; margin-top: 1.1rem; margin-bottom: .6rem; }
    .gender-key span { font-weight: 800; }

    /* ── news ── */
    .status { display: flex; align-items: center; gap: .5rem; font-size: .88rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
    .dot.off { background: var(--muted); }
    .tipbox { background: rgba(255,228,92,.5); padding: .85rem 1.1rem; margin-bottom: 1.5rem; font-size: .92rem; max-width: 62ch; }
    .tipbox b { display: block; font-weight: 800; margin-bottom: .1rem; }
    .news { list-style: none; border-top: 2px solid var(--ink); }
    .article { border-bottom: 1px solid var(--rule); }
    .article-btn { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; width: 100%; padding: 1rem .5rem; transition: background .12s; }
    .article-btn:hover { background: rgba(255,228,92,.22); }
    .article-title { font-family: var(--serif); font-weight: 600; font-size: 1.12rem; line-height: 1.4; }
    .article-date { font-size: .82rem; color: var(--muted); display: block; margin-top: .15rem; font-family: var(--sans); font-weight: 400; }
    .article-chev { font-weight: 800; color: var(--ink); flex-shrink: 0; font-size: 1.1rem; }
    .article-body { padding: .1rem .5rem 1.4rem; }
    .article-body p.desc { font-family: var(--serif); font-size: 1.02rem; line-height: 1.8; max-width: 62ch; }
    .strategy { margin: 1rem 0; padding-left: .9rem; border-left: 3px solid var(--ink); font-size: .9rem; max-width: 62ch; }
    .status-note { color: var(--muted); }
    .ai-panel { border: 2px solid var(--ink); background: var(--paper); padding: 1rem 1.15rem; margin-bottom: 1.5rem; max-width: 62ch; font-size: .92rem; }
    .ai-panel b { display: block; font-weight: 800; margin-bottom: .2rem; }
    .ai-panel p { color: var(--muted); margin-bottom: .75rem; }
    .ai-panel .status { margin-bottom: 0; }
    .ai-panel .status b { display: inline; margin: 0; }
    .ai-row { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .75rem; }
    .ai-row input { flex: 1 1 14rem; min-width: 0; padding: .45rem .7rem; border: 2px solid var(--ink); border-radius: 3px; background: #fff; font: inherit; color: var(--text); }
    .loader { padding: 3rem 0; display: flex; align-items: center; gap: .8rem; color: var(--muted); }
    .spin { width: 22px; height: 22px; border: 3px solid var(--rule); border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── fluid layouts: use the width that is there ── */
    .sheet { width: 100%; max-width: 1240px; }
    .ex-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 310px), 1fr)); column-gap: 2.5rem; align-items: start; }
    .words { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); column-gap: 2.25rem; align-items: start; border-top: none; }
    .word { border-top: 2px solid var(--ink); border-bottom: none; }
    .word:last-child { border-bottom: none; }
    .news { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); column-gap: 2.25rem; align-items: start; border-top: none; }
    .article { border-top: 2px solid var(--ink); border-bottom: none; }
    .story-layout { display: block; }
    .rail-meta { display: none; }
    @media (min-width: 1180px) {
      .story-layout { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 3.5rem; align-items: start; }
      .story-layout .qs { margin-top: 0; position: sticky; top: 1.5rem; }
    }
    @media (min-width: 1700px) { html { font-size: 112.5%; } .sheet { max-width: 1400px; } }

    /* ── tablet and phone: rail becomes a sticky top bar ── */
    @media (max-width: 1000px) {
      .shell { flex-direction: column; }
      .rail { position: sticky; top: 0; inset: auto; width: auto; border-right: none; border-bottom: 2px solid var(--ink); padding: .75rem clamp(1rem, 3vw, 2rem) 0; flex-direction: column; }
      .rail-top { display: flex; align-items: center; justify-content: flex-start; gap: .5rem; }
      .brand { font-size: 1.6rem; display: inline; }
      .brand-level { display: inline; margin: 0 0 0 .6rem; }
      .rail-meta { display: flex; align-items: center; gap: 1rem; font-size: .9rem; margin-left: auto; }
      .rail-meta .linkbtn { padding: .6rem 0; }
      .tabs { margin-top: .4rem; display: flex; flex: none; overflow-x: auto; scrollbar-width: none; }
      .tabs::-webkit-scrollbar { display: none; }
      .tabs li { flex: 1 0 auto; }
      .tab { width: 100%; text-align: center; white-space: nowrap; border-bottom: none; padding: .8rem 1rem; min-height: 44px; }
      .tab small { display: none; }
      .score, .reset { display: none; }
      .stage { margin-left: 0; padding: 1.75rem clamp(1rem, 4vw, 2.5rem) 3.5rem; }
      .sheet { padding: 1.75rem clamp(1.1rem, 3.5vw, 2rem) 2.25rem; max-width: none; }
    }
    @media (max-width: 600px) {
      .stage { padding: 1rem .75rem 2.5rem; }
      .sheet { padding: 1.25rem 1rem 1.75rem; border-width: 2px; box-shadow: 3px 3px 0 var(--ink); }
      .cover { padding: 1rem .75rem; align-items: flex-start; }
      .cover-sheet { padding: 1.5rem 1.1rem; box-shadow: 3px 3px 0 var(--ink); }
      .cover h2 { margin-top: 1.75rem; }
      .level-row { padding: 1rem .4rem; gap: .8rem; }
      .level-code { width: 2.6rem; font-size: 1.4rem; }
      .head { margin-bottom: 1.25rem; }
      .head-tools { width: 100%; }
      .btn { min-height: 44px; justify-content: center; }
      .ex-sentence { font-size: 1.15rem; line-height: 2.2; }
      .blank { width: 6em; font-size: 1.6rem; }
      .ex-foot { flex-direction: column; align-items: flex-start; gap: .6rem; }
      .ex-foot .btn { width: 100%; }
      .prose { font-size: 1.05rem; line-height: 1.75; }
      .opt { padding: .8rem .5rem; }
      .word-btn, .article-btn { padding: 1rem .25rem; }
      .word-de { font-size: 1.5rem; }
      .word-pron { margin-left: 0; width: 100%; }
      .article-body, .word-more { padding-left: .25rem; padding-right: .25rem; }
      .tab { padding: .8rem .45rem; font-size: .9rem; }
      .tabs li { flex: 1 1 auto; }
      .rail-meta .mobile-hide { display: none; }
      .brand-level { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

// ══════════════════════════════════════════════════════════
//  CONTENT DATABASE  (exercises now include explanations)
// ══════════════════════════════════════════════════════════
const CONTENT = {
  A1: {
    exercises: [
      [
        { sentence: "Ich ___ Peter. Wie heißt du?", answer: "heiße", hint: "verb: to be called", english: "I am called Peter. What's your name?",
          explanation: "heißen (to be called) conjugates as: ich heiße, du heißt, er heißt. The ich-form always ends in -e." },
        { sentence: "Das ist ___ Buch. Es ist rot.", answer: "ein", hint: "indefinite article (neuter)", english: "That is a book. It is red.",
          explanation: "'Buch' is neuter (das Buch). The indefinite article for neuter nouns is 'ein' — not 'eine' (feminine) or 'einen' (masculine accusative)." },
        { sentence: "Wir ___ aus Deutschland.", answer: "kommen", hint: "verb: to come (wir-form)", english: "We come from Germany.",
          explanation: "kommen (to come) → wir/sie/Sie form always ends in -en: wir kommen. This is true for almost all German verbs." },
        { sentence: "Meine Mutter ___ Ärztin.", answer: "ist", hint: "verb: to be (sie-form)", english: "My mother is a doctor.",
          explanation: "sein (to be): ich bin, du bist, er/sie/es ist. 'Mutter' is third person singular (sie) → ist." },
        { sentence: "Ich ___ gern Kaffee.", answer: "trinke", hint: "verb: to drink (ich-form)", english: "I like to drink coffee.",
          explanation: "trinken (to drink) → ich-form: ich trinke. Regular verbs drop -en from the infinitive and add -e for ich." }
      ],
      [
        { sentence: "Er ___ jeden Morgen um 7 Uhr auf.", answer: "steht", hint: "aufstehen — separable verb (er-form)", english: "He gets up at 7 every morning.",
          explanation: "aufstehen is separable: the prefix 'auf' goes to the end. The er-form of stehen is steht → Er steht ... auf." },
        { sentence: "Das ist ___ Apfel. Er ist grün.", answer: "ein", hint: "indefinite article (masculine, nominative)", english: "That is an apple. It is green.",
          explanation: "'Apfel' is masculine (der Apfel). In nominative after 'Das ist', masculine indefinite article = ein." },
        { sentence: "Wir ___ heute ins Kino.", answer: "gehen", hint: "verb: to go (wir-form)", english: "We are going to the cinema today.",

    stories: [
      {
        title: "Der Kulturschock",
        story: `Mei ist 22 Jahre alt und kommt aus Taiwan. Sie hat ein Stipendium bekommen und studiert jetzt Architektur in Stuttgart. Obwohl sie gut Deutsch spricht, ist das Leben in Deutschland anfangs schwieriger als erwartet.\n\nDas Erste, was ihr auffällt: Alles ist ruhig. Im Supermarkt spricht niemand. Im Zug schauen alle auf ihr Handy. In Taiwan würde man mit dem Nachbarn plaudern — hier nicht.\n\nEin anderes Thema ist das Öffnen von Geschäften. Am Sonntag sind fast alle Läden zu. Das findet Mei seltsam, weil sie es gewohnt ist, rund um die Uhr einkaufen zu können.\n\nAber mit der Zeit lernt sie die deutschen Gewohnheiten zu schätzen. Sie findet die Pünktlichkeit bewundernswert. Und die Bäcker! Jeden Morgen kauft sie frisches Brot. Das gibt es so in Taiwan nicht.\n\nNach sechs Monaten fühlt sie sich wie zu Hause. Sie hat Freunde gefunden und sogar begonnen, einen Dialekt zu verstehen.`,

          { question: "Warum findet Mei die geschlossenen Sonntage seltsam?", options: ["Sie arbeitet am Sonntag", "In Taiwan kann man immer einkaufen", "Sie kauft gern ein"], correct: 1, explanation: "She's used to shopping around the clock in Taiwan." },

      {

        story: `Thomas arbeitet seit zehn Jahren als Ingenieur bei einer großen Firma. Sein Job ist sicher und gut bezahlt. Aber er ist nicht glücklich.\n\nSein Traum ist es, ein eigenes Café zu eröffnen. Er liebt Kaffee, Backwaren und den Kontakt mit Menschen. Jeden Abend nach der Arbeit backt er zu Hause und stellt Rezepte online.\n\nSeine Frau unterstützt ihn. „Du wirst nie wissen, ob du es nicht versuchst", sagt sie. Aber die Eltern von Thomas sind dagegen. „Es ist zu riskant", meint sein Vater.\n\nThomas macht einen Businessplan. Er spart zwei Jahre lang. Dann findet er eine gute Location in der Innenstadt.\n\nMit dreiunddreißig Jahren kündigt er seinen Job. Sein Café, „Kaffeepause", öffnet an einem verregneten Dienstagmorgen. In der ersten Woche kommen hundert Gäste. Thomas lächelt den ganzen Tag.`,

        title: "Das Erbe",
        story: `Als Großmutter Helga starb, hinterließ sie ein altes Bauernhaus in der Toskana. Niemand in der Familie hatte gewusst, dass sie es besaß. Die Entdeckung warf Fragen auf, die die Familie lange beschäftigen sollten.\n\nDas Haus war seit zwanzig Jahren nicht bewohnt worden. Efeu bedeckte die Fassade. Im Inneren stand noch das alte Mobiliar, als hätte die Zeit angehalten.\n\nDie drei Geschwister — Bettina, Karl und Luise — konnten sich nicht einigen. Bettina wollte das Haus verkaufen. Karl plädierte dafür, es zu renovieren und als Ferienhaus zu nutzen. Luise schwieg zunächst.\n\nErst beim zweiten Familientreffen gestand Luise, dass sie als Kind mit Helga dort gewesen war. Es war ein Geheimnis zwischen ihnen gewesen. Das änderte alles.\n\nAm Ende einigten sie sich: Das Haus würde renoviert, aber nicht verkauft. Es sollte als Treffpunkt der Familie erhalten bleiben — ein lebendiges Denkmal an Helga.`,

        story: `In einer Abteilung eines Berliner Technologieunternehmens kursierte ein Gerücht: Die Firma würde fusionieren. Niemand wusste genau, woher die Information stammte. Aber jeder sprach darüber.\n\nJana, die Projektleiterin, hörte das Gerücht von einem Kollegen, der es wiederum von der Assistentin der Geschäftsführung hatte. Oder so sagte er. Jana wurde unruhig. Sie hatte gerade einen Kredit aufgenommen.\n\nWochenlang herrschte Unsicherheit. Mitarbeiter begannen, Bewerbungen zu schicken. Meetings wurden kürzer, aber häufiger. Niemand sagte etwas Konkretes.\n\nDann, an einem Donnerstagmorgen, versammelte die Geschäftsführerin alle Mitarbeiter. Die Wahrheit war einfach: Es gab keine Fusion. Es hatte ein Missverständnis bei einer internen Präsentation gegeben.\n\nJana lachte erleichtert. Aber die Erfahrung hatte ihr etwas gezeigt: Wie schnell Unsicherheit das Vertrauen in einem Team zerstören kann — und wie wichtig klare Kommunikation ist.`,

        title: "Die Sprache des Schweigens",
        story: `Professor Kellner hatte dreißig Jahre lang Linguistik gelehrt, bevor er aufhörte zu sprechen. Nicht wegen einer Krankheit — er hatte einfach beschlossen, dass Worte zu oft missbraucht wurden.\n\nSeine Kollegen reagierten zunächst irritiert, dann mit Belustigung, schließlich mit Respekt. Er kommunizierte durch Notizen, Gesten und die ungewöhnliche Ausdrucksstärke seines Blickes. Seine Vorlesungen hielt er — paradoxerweise — nun schriftlich auf einer Tafel. Die Studierenden, die anfänglich geklagt hatten, fanden sie nun konzentrierter, dichter, wesentlicher.\n\nWas Kellner mit seinem Experiment zeigen wollte, ist umstritten. Manche deuten es als Kritik an der inflationären Sprachverwendung in der Wissenschaft. Andere sehen es als performativen Widerspruch — ein Linguist, der Schweigen wählt, zitiert damit das Unausgesprochene als mächtigste Aussage.\n\nSein letzter Artikel, kurz vor seiner Emeritierung verfasst, trug den Titel: „Was wir nicht sagen können, darüber müssen wir schweigen." Er enthielt genau eine Seite — leer.`,

      {
        title: "Zwischen den Welten",
        story: `Dilnoza Yusupova ist Übersetzerin — aber nicht im üblichen Sinne. Sie übersetzt keine Texte, sondern Lebenswirklichkeiten. Als Kulturvermittlerin arbeitet sie in Asylverfahren, in Krankenhäusern und bei Behördengängen für Menschen, die nicht nur sprachlich fremd sind, sondern auch institutionell.\n\nDas Schwierigste, sagt sie, ist nicht das Vokabular. Es ist das, was zwischen den Wörtern liegt: Implikaturen, Höflichkeitskonventionen, Machtgefälle. Ein Arzt, der „keine Garantie" gibt, meint etwas anderes als ein Patient, der das als Ablehnung versteht.\n\nDilnoza selbst kam als Kind aus Usbekistan nach München. Ihre ersten Monate beschreibt sie als „existenziell stumm" — sie verstand die Sprache, aber nicht die Welt dahinter.\n\nHeute gilt sie als Pionierin einer neuen Disziplin: der interkulturellen Pragmatik. Ihre Forschung zeigt, dass Missverständnisse zwischen Kulturen selten aus Unwissenheit entstehen — sondern aus dem falschen Glauben, man habe verstanden.`,

// Draw n items from a pool, avoiding anything already shown until the pool runs dry.
const seenInSession = {};
function drawFresh(poolKey, pool, n, idOf) {
  const seen = seenInSession[poolKey] || (seenInSession[poolKey] = new Set());
  let picked = shuffle(pool.filter(x => !seen.has(idOf(x)))).slice(0, n);
  if (picked.length < n) {
    seen.clear();
    const rest = shuffle(pool.filter(x => !picked.includes(x))).slice(0, n - picked.length);
    picked = picked.concat(rest);
  }
  picked.forEach(x => seen.add(idOf(x)));
  return picked;
}

function parseJsonLoose(text) {
  const start = text.search(/[\[{]/);
  if (start < 0) throw new Error('no-json');
  const close = text[start] === '[' ? ']' : '}';
  const end = text.lastIndexOf(close);
  if (end <= start) throw new Error('no-json');
  return JSON.parse(text.slice(start, end + 1));
}

async function askClaude(prompt, maxTokens) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 45000);
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      signal: controller.signal,
      headers: {
        'content-type': 'application/json',
        'x-api-key': getAiKey(),
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({ model: AI_MODEL, max_tokens: maxTokens, messages: [{ role: 'user', content: prompt }] })
    });
    if (!res.ok) throw new Error(res.status === 401 ? 'invalid-key' : 'http-' + res.status);
    const data = await res.json();
    return parseJsonLoose((data.content || []).map(b => b.text || '').join(''));
  } finally {
    clearTimeout(timer);
  }
}

function aiErrorMessage(e) {
  const m = e && e.message;
  if (m === 'invalid-key') return 'Your API key was rejected. Check it under AI settings.';
  if (m === 'http-429') return 'Rate limit reached.';
  if (m && m.startsWith('http-4')) return 'The AI request was refused (' + m.slice(5) + ').';
  return 'AI generation did not work this time.';
}

const isStr = v => typeof v === 'string' && v.trim().length > 0;
function validExercises(a) {
  return Array.isArray(a) && a.length >= 3 && a.every(x => x && isStr(x.sentence) && x.sentence.split('___').length === 2 &&
    isStr(x.answer) && isStr(x.hint) && isStr(x.english) && isStr(x.explanation));
}
function validStory(s) {
  return s && isStr(s.title) && isStr(s.story) && isStr(s.english_summary) && Array.isArray(s.questions) && s.questions.length >= 3 &&
    s.questions.every(q => q && isStr(q.question) && Array.isArray(q.options) && q.options.length === 3 && q.options.every(isStr) &&
      Number.isInteger(q.correct) && q.correct >= 0 && q.correct < 3);
}
function validVocab(a) {
  return Array.isArray(a) && a.length >= 4 && a.every(w => w && isStr(w.word) && isStr(w.meaning) && isStr(w.example) && isStr(w.example_english));
}

const avoidLine = list => list.length ? ` Do not reuse any of these: ${list.slice(-20).join(' | ')}.` : '';

async function aiExercises(level) {
  const topic = pickRandom(AI_TOPICS);
  const data = await askClaude(
    `You are a German teacher. Write 5 fill-in-the-blank exercises for CEFR level ${level} (${LEVEL_DESC[level]}), on the theme "${topic}". ` +
    `Each item is one German sentence with exactly one gap written as ___ . Only one single word may fit the gap. ` +
    `Return ONLY a JSON array of 5 objects with the keys: sentence, answer (the single word that fills the gap, exactly as it appears in the sentence), ` +
    `hint (short English grammar hint such as "verb: to go (wir-form)"), english (English translation of the full sentence), ` +
    `explanation (1-2 sentences in English explaining why the answer is correct).` + avoidLine(aiRecent.ex), 1800);
  if (!validExercises(data)) throw new Error('bad-shape');
  const items = data.slice(0, 5);
  items.forEach(x => aiRecent.ex.push(x.sentence));
  return items;
}

async function aiStory(level) {
  const topic = pickRandom(AI_TOPICS);
  const data = await askClaude(
    `You are a German teacher. Write an original short German story of about ${AI_WORDS[level]} words for CEFR level ${level} (${LEVEL_DESC[level]}), on the theme "${topic}". ` +
    `Return ONLY a JSON object with the keys: title (German), story (3-4 short paragraphs separated by \\n\\n), english_summary (2 sentences), ` +
    `questions (array of 4 objects with keys: question (German), options (array of exactly 3 German answers), correct (0-based index of the right option), ` +
    `explanation (one English sentence pointing to the text)).` + avoidLine(aiRecent.st), 2200);
  if (!validStory(data)) throw new Error('bad-shape');
  aiRecent.st.push(data.title);
  return data;
}

async function aiVocab(level) {
  const topic = pickRandom(AI_TOPICS);
  const data = await askClaude(
    `You are a German teacher. Give 6 useful German vocabulary words for CEFR level ${level} (${LEVEL_DESC[level]}), loosely connected to the theme "${topic}". ` +
    `Return ONLY a JSON array of 6 objects with the keys: word (nouns include their article, e.g. "die Rechnung"), ` +
    `type (noun, verb, adjective, adverb or phrase), pronunciation (simple English-style respelling, e.g. "SHPA-tsee-ren"), meaning (English), ` +
    `example (a German sentence), example_english (its translation), tip (a short memory tip or usage note).` + avoidLine(aiRecent.vo), 1600);
  if (!validVocab(data)) throw new Error('bad-shape');
  const items = data.slice(0, 6);
  items.forEach(w => aiRecent.vo.push(w.word));
  return items;
}

function Head({ title, sub, children }) {
  return (
    <div className="head">
      <div>
        <h2>{title}</h2>
        <p>{sub}</p>
      </div>
      <div className="head-tools">{children}</div>
    </div>

}

// Nouns are coloured by gender, the way German classrooms teach them
function GermanWord({ word }) {
  const m = word.match(/^(der|die|das)\s+(.*)$/i);
  if (!m) return <>{word}</>;
  return <><span className={'art-' + m[1].toLowerCase()}>{m[1]}</span> {m[2]}</>;
}

// Score as a Strichliste: four strokes and a red slash per five
function Tally({ n }) {
  const groups = [];
  for (let left = n; left > 0; left -= 5) groups.push(Math.min(left, 5));
  const shown = groups.slice(-6);
  return (
    <div className="tally" aria-hidden="true">
      {shown.map((g, i) => (
        <span key={i} className={'tally-group' + (g === 5 ? ' five' : '')}>
          {Array.from({ length: Math.min(g, 5) }).map((_, k) => <i key={k} />)}
        </span>
      ))}
    </div>
  );
}

function GenStatus({ aiOn, src, note }) {
  if (!aiOn && !note) return null;
  return (
    <p className="status" aria-live="polite">
      <span className={'dot' + (src === 'ai' ? '' : ' off')} />
      <b>{src === 'ai' ? 'Freshly written by AI' : 'From the practice pool'}</b>
      {note && <span className="status-note">{note} Showing a practice-pool set instead.</span>}
    </p>
  );
}

function ExerciseSection({ level, setScore, aiOn }) {
  const drawSet = () => drawFresh('ex:' + level, CONTENT[level].exercises.flat(), 5, x => x.sentence);
  const [exercises, setExercises] = useState(drawSet);
  const [answers, setAnswers] = useState({});
  const [checked, setChecked] = useState({});
  const [shake, setShake] = useState(null);
  const [busy, setBusy] = useState(false);
  const [src, setSrc] = useState('pool');
  const [note, setNote] = useState('');

  const generate = async () => {
    if (busy) return;
    let next = null, nextSrc = 'pool', nextNote = '';
    if (getAiKey()) {
      setBusy(true);
      try { next = await aiExercises(level); nextSrc = 'ai'; }
      catch (e) { nextNote = aiErrorMessage(e); }
    }
    setExercises(next || drawSet());
    setSrc(nextSrc); setNote(nextNote);
    setAnswers({}); setChecked({}); setBusy(false);
  };

  const checkAnswer = (i) => {
    if (checked[i] !== undefined) return;
    const correct = (answers[i] || '').trim().toLowerCase() === exercises[i].answer.trim().toLowerCase();
    setChecked(prev => ({ ...prev, [i]: correct }));
    if (correct) setScore(s => s + 1);
    else { setShake(i); setTimeout(() => setShake(null), 500); }
  };

  const total = exercises.length;
  const done = Object.keys(checked).length;
  const correctCount = Object.values(checked).filter(Boolean).length;

  return (
    <section>
      <Head title="Fill in the blanks" sub="Write the missing word. Every answer comes with an explanation.">
        {done > 0 && <span className="mark-chip" aria-live="polite">{correctCount} of {done} right</span>}
        <button className="btn btn-line btn-small" onClick={generate} disabled={busy}>{busy ? 'Writing…' : 'New exercises'}</button>
      </Head>

      <GenStatus aiOn={aiOn} src={src} note={note} />

      {busy && <Loader text="Writing new exercises…" />}

      {!busy && (
      <ol className="ex-list">
        {exercises.map((ex, i) => {
          const isChecked = checked[i] !== undefined;
          const isCorrect = checked[i];
          const typed = (answers[i] || '').trim();
          return (
            <li key={i} className={'ex' + (shake===i ? ' shake-it' : '')}>
              <p className="ex-hint">{ex.hint}</p>
              <p className="ex-sentence">
                {ex.sentence.split('___').map((part, j, arr) => (
                  <React.Fragment key={j}>
                    {part}
                    {j < arr.length - 1 && (
                      <>
                        <input type="text" aria-label={`Answer for exercise ${i+1}`} autoComplete="off" autoCapitalize="off" spellCheck="false"
                          className={'blank' + (isChecked ? (isCorrect ? ' ok' : ' no') : '')}
                          value={answers[i] || ''} disabled={isChecked}
                          onChange={e => setAnswers(p => ({ ...p, [i]: e.target.value }))}
                          onKeyDown={e => e.key === 'Enter' && checkAnswer(i)} />
                        {isChecked && !isCorrect && <span className="fix">{ex.answer}</span>}
                      </>
                    )}
                  </React.Fragment>
                ))}
              </p>

              <div className="ex-foot">
                {!isChecked
                  ? <button className="btn btn-solid btn-small" onClick={() => checkAnswer(i)}>Check</button>
                  : <span className={'verdict ' + (isCorrect ? 'ok' : 'no')}>{isCorrect ? 'Correct' : `Not quite. The answer is “${ex.answer}”.`}</span>}
                <span className="ex-english">{ex.english}</span>
              </div>

              {isChecked && !isCorrect && (
                <p className="note bad">
                  <b>Why “{typed || 'an empty answer'}” doesn’t fit: </b>
                  this gap tests {ex.hint}, and that form isn’t valid in this sentence.
                </p>
              )}
              {isChecked && ex.explanation && (
                <p className={'note ' + (isCorrect ? 'good' : '')}>
                  <b>{isCorrect ? 'Why this is correct: ' : `Why “${ex.answer}” is correct: `}</b>{ex.explanation}
                </p>
              )}
            </li>
          );
        })}
      </ol>
      )}

      {!busy && done === total && (
        <div className="summary">
          <p>{correctCount === total ? 'Perfect score.' : `${correctCount} out of ${total}. Keep going.`}</p>
          <p>Try another set to keep practising.</p>
          <button className="btn btn-solid btn-small" onClick={generate}>New exercises</button>
        </div>
      )}
    </section>
  );
}

function StorySection({ level, setScore, aiOn }) {
  const drawStory = () => drawFresh('st:' + level, CONTENT[level].stories, 1, s => s.title)[0];
  const [story, setStory] = useState(drawStory);
  const [selected, setSelected] = useState({});
  const [showSummary, setShowSummary] = useState(false);
  const [busy, setBusy] = useState(false);
  const [src, setSrc] = useState('pool');
  const [note, setNote] = useState('');

  const newStory = async () => {
    if (busy) return;
    let next = null, nextSrc = 'pool', nextNote = '';
    if (getAiKey()) {
      setBusy(true);
      try { next = await aiStory(level); nextSrc = 'ai'; }
      catch (e) { nextNote = aiErrorMessage(e); }
    }
    setStory(next || drawStory());
    setSrc(nextSrc); setNote(nextNote);
    setSelected({}); setShowSummary(false); setBusy(false);
  };

  const pick = (qi, oi) => {
    if (selected[qi] !== undefined) return;
    setSelected(p => ({ ...p, [qi]: oi }));
    if (oi === story.questions[qi].correct) setScore(s => s + 1);
  };

  return (
    <section>
      <Head title={busy ? 'A new story' : story.title} sub="Read the story, then answer the questions.">
        <button className="btn btn-line btn-small" onClick={newStory} disabled={busy}>{busy ? 'Writing…' : 'New story'}</button>
      </Head>

      <GenStatus aiOn={aiOn} src={src} note={note} />

      {busy && <Loader text="Writing a new story…" />}

      {!busy && (
      <div className="story-layout">
      <div>
      <div className="prose">
        {story.story.split('\n').filter(p => p.trim()).map((p, i) => <p key={i}>{p}</p>)}
      </div>
      <div style={{ marginTop: '1rem' }}>
        <button className="linkbtn" aria-expanded={showSummary} onClick={() => setShowSummary(!showSummary)}>
          {showSummary ? 'Hide English summary' : 'Show English summary'}
        </button>
        {showSummary && <p className="translation">{story.english_summary}</p>}
      </div>

      </div>
      <ol className="qs">
        {story.questions.map((q, qi) => {
          const answered = selected[qi] !== undefined;
          return (
            <li key={qi} className="q">
              <p className="q-text">{q.question}</p>
              <ul className="opts">
                {q.options.map((opt, oi) => {
                  const isRight = oi === q.correct;
                  const cls = answered ? (isRight ? ' right' : selected[qi] === oi ? ' wrong' : '') : '';
                  return (
                    <li key={oi}>
                      <button className={'opt' + cls} disabled={answered} onClick={() => pick(qi, oi)}>
                        <span className="opt-letter">{LETTERS[oi]}</span>
                        <span>{opt}</span>
                      </button>
                    </li>
                  );
                })}
              </ul>
              {answered && q.explanation && <p className="note good" style={{ marginTop: '.7rem' }}>{q.explanation}</p>}
            </li>
          );
        })}
      </ol>
      </div>
      )}
    </section>
  );
}

function Loader({ text }) {

// Each refresh samples two German-focused and two international feeds, then mixes
// roughly 6 domestic and 4 international stories, skipping links already shown.

  { id: 'ts-top',  label: 'Tagesschau',            url: 'https://www.tagesschau.de/xml/rss2',                   scope: 'de' },
  { id: 'ts-in',   label: 'Tagesschau Inland',     url: 'https://www.tagesschau.de/inland/index~rss2.xml',      scope: 'de' },
  { id: 'ts-wi',   label: 'Tagesschau Wirtschaft', url: 'https://www.tagesschau.de/wirtschaft/index~rss2.xml',  scope: 'de' },
  { id: 'stern',   label: 'stern Politik',         url: 'https://www.stern.de/feed/standard/politik/',          scope: 'de' },
  { id: 'ts-aus',  label: 'Tagesschau Ausland',    url: 'https://www.tagesschau.de/ausland/index~rss2.xml',     scope: 'intl' },
  { id: 'dw-all',  label: 'Deutsche Welle',        url: 'https://rss.dw.com/rdf/rss-de-all',                    scope: 'intl' },
  { id: 'dw-top',  label: 'DW Top-Thema',          url: 'https://rss.dw.com/rdf/rss-de-top',                    scope: 'intl' }
];
const NEWS_TARGET = { de: 6, intl: 4 };
const seenNewsLinks = new Set();

// Short practice articles about the wider world, used when the live feeds can't be reached.
const FALLBACK_NEWS_INTL = {
  A1: [
    { title: "Ein Baby-Panda im Zoo", description: "Im Zoo gibt es ein Panda-Baby. Es ist klein und schwarz-weiß. Viele Menschen kommen und schauen. Der Zoo sagt: Das Baby ist gesund und isst gut.", pubDate: "Heute", link: "https://www.tagesschau.de/ausland/", source: "Übungsartikel", scope: "intl" },

  ],
  A2: [
    { title: "Frankreich: Mehr Menschen fahren mit dem Zug", description: "In Frankreich fahren immer mehr Menschen mit dem Zug. Die Preise für Tickets sind für junge Leute niedriger. Viele sagen: Das ist gut für die Umwelt und billiger als das Auto.", pubDate: "Heute", link: "https://www.tagesschau.de/ausland/", source: "Übungsartikel", scope: "intl" },
    { title: "Japan: Roboter helfen in Pflegeheimen", description: "In Japan arbeiten Roboter in Pflegeheimen. Sie bringen Essen, spielen Spiele und helfen den Menschen beim Aufstehen. Es gibt dort nicht genug Pflegekräfte, deshalb sind die Roboter eine große Hilfe.", pubDate: "Heute", link: "https://www.tagesschau.de/ausland/", source: "Übungsartikel", scope: "intl" }
  ],
  B1: [

  ],
  B2: [
    { title: "Europäische Union ringt um gemeinsame Asylpolitik", description: "Seit Jahren versuchen die Mitgliedstaaten, sich auf eine gemeinsame Asylpolitik zu einigen. Während Länder an den Außengrenzen mehr Solidarität verlangen, lehnen andere verbindliche Aufnahmequoten ab. Beobachter halten einen Kompromiss nur für möglich, wenn beide Seiten Zugeständnisse machen.", pubDate: "Heute", link: "https://www.tagesschau.de/ausland/", source: "Übungsartikel", scope: "intl" },
    { title: "Klimakonferenz: Streit um die Finanzierung", description: "Auf der Weltklimakonferenz ist erneut ein Streit über die Finanzierung von Klimaschäden entbrannt. Entwicklungsländer fordern verbindliche Zusagen der Industriestaaten, die ihrerseits auf die Verantwortung großer Schwellenländer verweisen.", pubDate: "Heute", link: "https://www.tagesschau.de/ausland/", source: "Übungsartikel", scope: "intl" }
  ],

// These publishers allow cross-origin reads of their feeds, so no proxy is needed.
function fetchFeed(url) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 8000);
  return fetch(url, { signal: controller.signal })
    .then(r => { if (!r.ok) throw new Error('bad'); return r.text(); })
    .finally(() => clearTimeout(timeout));
}

function parseRssXml(xmlText, src) {
  const xml = new DOMParser().parseFromString(xmlText, 'text/xml');
  if (xml.querySelector('parsererror')) return [];
  return Array.from(xml.querySelectorAll('item')).slice(0, 25).map(item => {
    const getText = (tag) => item.querySelector(tag)?.textContent?.trim() || '';
    const rawLink = getText('link') || '';
    const rawDate = getText('pubDate') || getText('dc\\:date') || '';
    let dateStr = '';
    try { if (rawDate) dateStr = new Date(rawDate).toLocaleDateString('de-DE', { day: 'numeric', month: 'long' }); } catch (e) {}
    return {
      title: stripHtml(getText('title')),
      description: stripHtml(getText('description')).slice(0, 320),
      link: rawLink.startsWith('http') ? rawLink : '#',
      pubDate: dateStr,
      source: src.label,
      scope: src.scope
    };
  }).filter(a => a.title);
}

// Dedupe, prefer links not shown yet, then fill up with already-seen ones if needed.
function chooseArticles(items, n) {
  const uniq = [];
  const keys = new Set();
  items.forEach(a => {
    const k = a.link !== '#' ? a.link : a.title;
    if (!keys.has(k)) { keys.add(k); uniq.push(a); }
  });
  const isNew = a => !seenNewsLinks.has(a.link !== '#' ? a.link : a.title);
  return shuffle(uniq.filter(isNew)).concat(shuffle(uniq.filter(a => !isNew(a)))).slice(0, n);
}

function NewsSection({ level }) {
  const [articles, setArticles] = useState([]);
  const [loading, setLoading] = useState(true);
  const [expanded, setExpanded] = useState(null);
  const [isLive, setIsLive] = useState(false);
  const [usedSources, setUsedSources] = useState([]);

  const loadFallback = useCallback(() => {
    const pool = (FALLBACK_NEWS[level] || FALLBACK_NEWS['B1']).concat(FALLBACK_NEWS_INTL[level] || []);
    setArticles(drawFresh('news:' + level, pool, 6, a => a.title));
    setUsedSources([]);
    setIsLive(false);
    setLoading(false);
  }, [level]);

  const fetchNews = useCallback(() => {
    setLoading(true); setArticles([]); setExpanded(null); setIsLive(false);
    const chosen = shuffle(NEWS_SOURCES.filter(s => s.scope === 'de')).slice(0, 2)
      .concat(shuffle(NEWS_SOURCES.filter(s => s.scope === 'intl')).slice(0, 2));
    Promise.all(chosen.map(src =>
      fetchFeed(src.url).then(xml => parseRssXml(xml, src)).catch(() => [])
    )).then(results => {
      const domestic = results.filter((_, i) => chosen[i].scope === 'de').flat();
      const intl = results.filter((_, i) => chosen[i].scope === 'intl').flat();
      let de = chooseArticles(domestic, NEWS_TARGET.de);
      let world = chooseArticles(intl, NEWS_TARGET.intl);
      const total = NEWS_TARGET.de + NEWS_TARGET.intl;
      if (de.length < NEWS_TARGET.de) world = chooseArticles(intl, total - de.length);
      if (world.length < NEWS_TARGET.intl) de = chooseArticles(domestic, total - world.length);
      const mixed = shuffle(de.concat(world));
      if (mixed.length === 0) { loadFallback(); return; }
      mixed.forEach(a => seenNewsLinks.add(a.link !== '#' ? a.link : a.title));
      setArticles(mixed);
      setUsedSources(chosen.filter((_, i) => results[i].length > 0).map(s => s.label));
      setIsLive(true);
      setLoading(false);
    });
  }, [level, loadFallback]);

  useEffect(() => { fetchNews(); }, [fetchNews]);

  const tip = LEVEL_NEWS_TIPS[level];

  return (
    <section>
      <Head title="Nachrichten"
        sub={isLive ? 'Live headlines from Germany and around the world.' : `Practice articles written for ${level}.`}>
        <button className="btn btn-line btn-small" onClick={fetchNews} disabled={loading}>{loading ? 'Loading…' : 'Refresh'}</button>
      </Head>

      {!loading && (
        <p className="status">
          <span className={'dot' + (isLive ? '' : ' off')} />
          <b>{isLive ? 'Live feed' : 'Practice articles'}</b>
          {isLive && usedSources.length > 0 && <span className="status-note">{usedSources.join(' · ')}</span>}
          {!isLive && <span className="status-note">The live feed isn’t available right now.</span>}
        </p>
      )}

      <div className="tipbox"><b>{tip.label}</b>{tip.tip}</div>

      {loading && <Loader text="Loading news…" />}

      {!loading && articles.length > 0 && (
        <ul className="news">
          {articles.map((article, i) => {
            const isOpen = expanded === i;
            const scopeLabel = article.source === 'Übungsartikel' && article.scope === 'intl' ? 'Übungsartikel · International' : article.source;
            return (
              <li key={i} className="article">
                <button className="article-btn" aria-expanded={isOpen} onClick={() => setExpanded(isOpen ? null : i)}>
                  <span>
                    <span className="article-title">{article.title}</span>
                    <span className="article-date">{scopeLabel}{article.pubDate ? ' · ' + article.pubDate : ''}</span>
                  </span>
                  <span className="article-chev" aria-hidden="true">{isOpen ? '−' : '+'}</span>
                </button>
                {isOpen && (
                  <div className="article-body">
                    {article.description && (
                      <p className="desc">{article.description}{article.description.length >= 318 && '…'}</p>
                    )}
                    <p className="strategy"><b>Reading strategy for {level}: </b>{READING_STRATEGY[level]}</p>
                    {article.link !== '#' && (
                      <a className="btn btn-solid btn-small" href={article.link} target="_blank" rel="noopener noreferrer">
                        {isLive ? 'Read the article' : 'Visit the news site'} ({article.source})
                      </a>
                    )}
                  </div>
                )}
              </li>
            );
          })}
        </ul>
      )}
    </section>
  );
}

// ══════════════════════════════════════════════════════════
//  DASHBOARD
// ══════════════════════════════════════════════════════════
function AiSettings({ aiOn, onChange, onClose }) {
  const [draft, setDraft] = useState('');
  const save = () => { const k = draft.trim(); if (!k) return; saveAiKey(k); setDraft(''); onChange(); };
  const remove = () => { saveAiKey(''); setDraft(''); onChange(); };
  return (
    <div className="ai-panel" role="region" aria-label="AI content settings">
      <b>AI-written content</b>
      <p>Paste your own Claude API key and every “New …” button writes brand-new exercises, stories and words. The key stays in this browser only and is sent only to api.anthropic.com. Use a key with a low spend limit. Without a key the app draws from its built-in practice pool.</p>
      <div className="ai-row">
        <input type="password" aria-label="Claude API key" autoComplete="off" spellCheck="false"
          placeholder={aiOn ? 'A key is saved. Paste a new one to replace it.' : 'sk-ant-…'}
          value={draft} onChange={e => setDraft(e.target.value)} onKeyDown={e => e.key === 'Enter' && save()} />
        <button className="btn btn-solid btn-small" onClick={save}>Save key</button>
        {aiOn && <button className="btn btn-line btn-small" onClick={remove}>Remove key</button>}
        <button className="btn btn-line btn-small" onClick={onClose}>Close</button>
      </div>
      <p className="status"><span className={'dot' + (aiOn ? '' : ' off')} /><b>{aiOn ? 'AI content is on' : 'AI content is off'}</b></p>
    </div>
  );
}

function Dashboard({ level, onReset }) {
  const [section, setSection] = useState('exercises');
  const [score, setScore] = useState(0);
  const [aiOn, setAiOn] = useState(() => !!getAiKey());
  const [aiOpen, setAiOpen] = useState(false);

  const navItems = [
    { id:'exercises', label:'Fill in the blanks', desc:'Grammar practice' },
    { id:'story',     label:'Reading',            desc:'Read & answer' },
    { id:'vocabulary',label:'Vocabulary',         desc:'New words' },
    { id:'news',      label:'News',               desc:'Real headlines' }
  ];

  return (
    <div className="shell">
      <header className="rail">
        <div className="rail-top">
          <div className="brand">Deutsch</div>
          <div className="brand-level"><b>{level}</b> · {LEVEL_LABELS[level]}</div>
          <div className="rail-meta">
            <span aria-live="polite">Score <b>{score}</b></span>
            <button className="linkbtn" onClick={() => setAiOpen(o => !o)}>AI</button>
            <button className="linkbtn" onClick={onReset}>Change level</button>
          </div>
        </div>

        <nav aria-label="Sections">
          <ul className="tabs">
            {navItems.map(n => (
              <li key={n.id}>
                <button className="tab" aria-current={section===n.id ? 'page' : undefined} onClick={() => setSection(n.id)}>
                  {n.label}<small>{n.desc}</small>
                </button>
              </li>
            ))}
          </ul>
        </nav>

        <div className="score">
          <p className="score-title">Correct this session</p>
          <Tally n={score} />
          <p className="score-num" aria-live="polite">{score}</p>
        </div>

        <button className="reset" onClick={() => setAiOpen(o => !o)}>AI content settings</button>
        <button className="reset" onClick={onReset}>Change level</button>
      </header>

      <main className="stage">
        <div className="sheet">
          {aiOpen && <AiSettings aiOn={aiOn} onChange={() => setAiOn(!!getAiKey())} onClose={() => setAiOpen(false)} />}
          {section==='exercises'  && <ExerciseSection level={level} setScore={setScore} aiOn={aiOn} />}
          {section==='story'      && <StorySection     level={level} setScore={setScore} aiOn={aiOn} />}
          {section==='vocabulary' && <VocabSection      level={level} aiOn={aiOn} />}
          {section==='news'       && <NewsSection       level={level} />}
        </div>
      </main>
    </div>
  );
}

// ══════════════════════════════════════════════════════════
//  APP ROOT
// ══════════════════════════════════════════════════════════
function App() {
  const [level, setLevel] = useState(null);
  if (!level) return <SetupScreen onStart={setLevel} />;
  return <Dashboard level={level} onReset={() => setLevel(null)} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
